document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>LaunchPilot<\u002Ftitle>\n<script src=\"d521eae5-4ddf-49e9-9071-8f38c1474024\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n  body { margin: 0; background: #faf9f6; font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif; color: #201d19; }\n  a { color: oklch(50% 0.15 262); text-decoration: none; }\n  a:hover { color: oklch(40% 0.16 262); text-decoration: underline; }\n  select, input { font-family: inherit; }\n  ::placeholder { color: #a6a29b; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: #faf9f6; display: flex; flex-direction: column; --accent: {{ accentColor }};\">\n\n  <!-- TOP BAR -->\n  <div style=\"height: 64px; flex-shrink: 0; background: #ffffff; border-bottom: 1px solid #e5e2dc; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: relative; z-index: 20;\">\n    <div style=\"display: flex; align-items: center; gap: 10px;\">\n      <div style=\"width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px;\">L<\u002Fdiv>\n      <div style=\"font-weight: 700; font-size: 16px; letter-spacing: -0.01em;\">LaunchPilot<\u002Fdiv>\n      <div style=\"font-size: 12px; color: #8a857c; border-left: 1px solid #e5e2dc; padding-left: 10px; margin-left: 2px;\">beauty &amp; personal care<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ loggedIn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display: flex; align-items: center; gap: 18px;\">\n      <div sc-camel-on-click=\"{{ goToAllLaunches }}\" style=\"font-size: 13px; font-weight: 600; color: #55514a; cursor: pointer; padding: 6px 10px; border-radius: 8px;\" style-hover=\"background: #f3f1ec;\">All launches<\u002Fdiv>\n    <div style=\"position: relative;\">\n      <div sc-camel-on-click=\"{{ togglePersonaSwitcher }}\" style=\"display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 10px; border-radius: 8px;\" style-hover=\"background: #f3f1ec;\">\n        <div style=\"width: 30px; height: 30px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">{{ personaInitial }}<\u002Fdiv>\n        <div style=\"text-align: left;\">\n          <div style=\"font-size: 13px; font-weight: 600;\">{{ personaName }}<\u002Fdiv>\n          <div style=\"font-size: 11px; color: #8a857c;\">{{ personaRole }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 10px; color: #a6a29b; margin-left: 2px;\">▾<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ personaSwitcherOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ togglePersonaSwitcher }}\" style=\"position: fixed; inset: 0; z-index: 40;\"><\u002Fdiv>\n        <div style=\"position: absolute; top: 46px; right: 0; width: 290px; background: #fff; border: 1px solid #e5e2dc; border-radius: 12px; padding: 8px; box-sizing: border-box; z-index: 41;\">\n          <div style=\"font-size: 11px; color: #8a857c; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 8px 4px;\">Switch user (demo)<\u002Fdiv>\n          <sc-for list=\"{{ switcherUsers }}\" as=\"su\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ su.onSelect }}\" style=\"display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; background: {{ su.bg }};\">\n              <div style=\"width: 26px; height: 26px; border-radius: 999px; background: {{ su.avatarBg }}; color: {{ su.avatarColor }}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">{{ su.initial }}<\u002Fdiv>\n              <div style=\"flex: 1;\"><div style=\"font-size: 13px; font-weight: 600;\">{{ su.name }}<\u002Fdiv><div style=\"font-size: 11px; color: #8a857c;\">{{ su.roleLabel }}<\u002Fdiv><\u002Fdiv>\n              <sc-if value=\"{{ su.isCurrent }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"color: oklch(55% 0.16 145); font-size: 14px;\">✓<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div sc-camel-on-click=\"{{ goToAllLaunches }}\" style=\"display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; border-top: 1px solid #eeece7; margin-top: 4px;\" style-hover=\"background: #f3f1ec;\">\n            <div style=\"width: 26px; height: 26px; border-radius: 8px; background: #f3f1ec; color: #6b6862; font-size: 13px; display: flex; align-items: center; justify-content: center;\">◎<\u002Fdiv>\n            <div style=\"flex: 1;\"><div style=\"font-size: 13px; font-weight: 600;\">All launches<\u002Fdiv><div style=\"font-size: 11px; color: #8a857c;\">every product, shared view<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isLaunchLead }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ goToLaunches }}\" style=\"display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer;\" style-hover=\"background: #f3f1ec;\">\n              <div style=\"width: 26px; height: 26px; border-radius: 8px; background: #f3f1ec; color: #6b6862; font-size: 13px; display: flex; align-items: center; justify-content: center;\">▤<\u002Fdiv>\n              <div style=\"flex: 1;\"><div style=\"font-size: 13px; font-weight: 600;\">My launches<\u002Fdiv><div style=\"font-size: 11px; color: #8a857c;\">switch between your products<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div sc-camel-on-click=\"{{ goToRetro }}\" style=\"display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer;\" style-hover=\"background: #f3f1ec;\">\n            <div style=\"width: 26px; height: 26px; border-radius: 8px; background: #f3f1ec; color: #6b6862; font-size: 13px; display: flex; align-items: center; justify-content: center;\">↻<\u002Fdiv>\n            <div style=\"flex: 1;\"><div style=\"font-size: 13px; font-weight: 600;\">View retrospective<\u002Fdiv><div style=\"font-size: 11px; color: #8a857c;\">jump straight to the launch retro<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ canAccessAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ goToAdmin }}\" style=\"display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer;\">\n              <div style=\"width: 26px; height: 26px; border-radius: 8px; background: #f3f1ec; color: #6b6862; font-size: 13px; display: flex; align-items: center; justify-content: center;\">⚙<\u002Fdiv>\n              <div style=\"flex: 1;\"><div style=\"font-size: 13px; font-weight: 600;\">Manage user roles<\u002Fdiv><div style=\"font-size: 11px; color: #8a857c;\">admin settings<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div sc-camel-on-click=\"{{ logout }}\" style=\"display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer;\">\n            <div style=\"width: 26px; height: 26px; border-radius: 8px; background: #f3f1ec; color: #6b6862; font-size: 13px; display: flex; align-items: center; justify-content: center;\">⏻<\u002Fdiv>\n            <div style=\"flex: 1;\"><div style=\"font-size: 13px; font-weight: 600;\">Log out<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"flex: 1; display: flex; flex-direction: column;\">\n\n  <!-- SCREEN: RESET PASSWORD -->\n  <sc-if value=\"{{ isReset }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 460px; margin: 60px auto; padding: 40px; background: #fff; border: 1px solid #e5e2dc; border-radius: 14px; box-sizing: border-box; box-shadow: 0 4px 16px rgba(32,29,25,0.06);\">\n      <div sc-camel-on-click=\"{{ backToLoginFromReset }}\" style=\"font-size: 13px; font-weight: 600; color: #6b6862; cursor: pointer; margin-bottom: 18px;\">← back to log in<\u002Fdiv>\n      <div style=\"font-size: 20px; font-weight: 700; margin-bottom: 4px;\">Reset your password<\u002Fdiv>\n      <div style=\"font-size: 13px; color: #6b6862; margin-bottom: 24px;\">Works for any role — enter the email on your account and we'll send reset instructions.<\u002Fdiv>\n\n      <sc-if value=\"{{ resetSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 14px; border-radius: 8px; background: oklch(94% 0.04 150); font-size: 13.5px; color: oklch(35% 0.1 150); margin-bottom: 18px;\">✓ Reset instructions sent to {{ resetEmail }} (demo — no email actually sent).<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ backToLoginFromReset }}\" style=\"text-align: center; padding: 11px; border-radius: 8px; border: 1px solid #d8d4cc; font-size: 14px; font-weight: 700; cursor: pointer;\">Back to log in<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ resetNotSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size: 12px; font-weight: 600; color: #55514a; margin-bottom: 6px;\">Email<\u002Fdiv>\n        <input value=\"{{ resetEmail }}\" sc-camel-on-change=\"{{ onResetEmailChange }}\" placeholder=\"you@brand.com\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; margin-bottom: 14px;\">\n        <sc-if value=\"{{ resetError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 12.5px; color: oklch(50% 0.16 25); margin-bottom: 12px;\">{{ resetError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div sc-camel-on-click=\"{{ submitReset }}\" style=\"text-align: center; padding: 11px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.15s;\" style-hover=\"background: color-mix(in oklch, var(--accent) 82%, black);\">Send reset link<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN 0: LOGIN -->\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"max-width: 460px; margin: 60px auto; padding: 40px; background: #fff; border: 1px solid #e5e2dc; border-radius: 14px; box-sizing: border-box; box-shadow: 0 4px 16px rgba(32,29,25,0.06);\">\n      <div style=\"width: 44px; height: 44px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 20px; margin-bottom: 16px;\">L<\u002Fdiv>\n      <div style=\"font-size: 20px; font-weight: 700; margin-bottom: 4px;\">Log in to LaunchPilot<\u002Fdiv>\n      <div style=\"font-size: 13px; color: #6b6862; margin-bottom: 20px;\">Your assigned role decides which screen you land on.<\u002Fdiv>\n\n      <div style=\"font-size: 12px; font-weight: 600; color: #55514a; margin-bottom: 6px;\">Email<\u002Fdiv>\n      <input value=\"{{ loginEmail }}\" sc-camel-on-change=\"{{ onLoginEmailChange }}\" placeholder=\"you@brand.com\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; margin-bottom: 14px;\">\n      <div style=\"font-size: 12px; font-weight: 600; color: #55514a; margin-bottom: 6px;\">Password<\u002Fdiv>\n      <input type=\"password\" value=\"{{ loginPassword }}\" sc-camel-on-change=\"{{ onLoginPasswordChange }}\" placeholder=\"••••••••\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; margin-bottom: 6px;\">\n      <div style=\"font-size: 11.5px; color: #a6a29b; margin-bottom: 14px;\">At least 8 characters.<\u002Fdiv>\n      <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size: 12.5px; color: oklch(50% 0.16 25); margin-bottom: 12px;\">{{ loginError }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <div sc-camel-on-click=\"{{ submitLogin }}\" style=\"text-align: center; padding: 11px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 10px; transition: background 0.15s;\" style-hover=\"background: color-mix(in oklch, var(--accent) 82%, black);\">Log in<\u002Fdiv>\n      <div style=\"text-align: center; margin-bottom: 20px;\"><a href=\"#\" sc-camel-on-click=\"{{ goToReset }}\" style=\"font-size: 12.5px;\">Forgot password?<\u002Fa><\u002Fdiv>\n\n      <div style=\"font-size: 11px; color: #8a857c; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px;\">Or continue as (demo)<\u002Fdiv>\n      <div style=\"border: 1px solid #eeece7; border-radius: 12px; overflow: hidden;\">\n        <sc-for list=\"{{ loginUsers }}\" as=\"lu\" hint-placeholder-count=\"5\">\n          <div sc-camel-on-click=\"{{ lu.onLogin }}\" style=\"display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #f0eeea; cursor: pointer;\" style-hover=\"background: #faf9f6;\">\n            <div style=\"width: 34px; height: 34px; border-radius: 999px; background: {{ lu.avatarBg }}; color: {{ lu.avatarColor }}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">{{ lu.initial }}<\u002Fdiv>\n            <div style=\"flex: 1;\">\n              <div style=\"font-size: 14px; font-weight: 600;\">{{ lu.name }}<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #8a857c;\">{{ lu.email }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #f3f1ec; color: #55514a; white-space: nowrap;\">{{ lu.roleLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size: 12px; color: #a6a29b; margin-top: 16px; text-align: center;\">Roles are assigned by an admin or launch lead.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN: ADMIN — MANAGE ROLES -->\n  <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 640px; margin: 0 auto; padding: 32px; width: 100%; box-sizing: border-box;\">\n      <div sc-camel-on-click=\"{{ goToAdminBack }}\" style=\"font-size: 13px; font-weight: 600; color: #6b6862; cursor: pointer; margin-bottom: 14px;\">← back<\u002Fdiv>\n      <div style=\"font-size: 20px; font-weight: 700; margin-bottom: 24px;\">Manage user roles<\u002Fdiv>\n\n      <sc-if value=\"{{ inviteConfirmation }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 10px 14px; border-radius: 8px; background: oklch(94% 0.04 150); color: oklch(35% 0.1 150); font-size: 12.5px; font-weight: 600; margin-bottom: 16px;\">{{ inviteConfirmation }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"font-size: 13px; font-weight: 700; margin-bottom: 10px;\">Add access for a new user<\u002Fdiv>\n      <div style=\"display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap;\">\n        <input value=\"{{ newPersonEmail }}\" sc-camel-on-change=\"{{ onNewPersonEmailChange }}\" placeholder=\"email@brand.com\" style=\"flex: 1.6; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px;\">\n        <sc-raw-select value=\"{{ newPersonTier }}\" sc-camel-on-change=\"{{ onNewPersonTierChange }}\" style=\"flex: 1; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; background: #fff;\">\n          <sc-for list=\"{{ tierOptions }}\" as=\"tro\" hint-placeholder-count=\"3\">\n            <option value=\"{{ tro.value }}\">{ 002Fdiv>\n        <div style=\"font-size: 11.5px; color: #8a857c; margin-bottom: 10px;\">Full launch activity, including compliance sign-offs — so you know when it's safe to start your own work.<\u002Fdiv>\n        <sc-for list=\"{{ trailPreview }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0eeea;\">\n            <div style=\"width: 24px; height: 24px; border-radius: 999px; background: #f3f1ec; color: #6b6862; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">{{ e.initial }}<\u002Fdiv>\n            <div style=\"flex: 1;\">\n              <div style=\"font-size: 12.5px;\"><strong>{{ e.name }}<\u002Fstrong> {{ e.action }} on <strong>{{ e.task }}<\u002Fstrong><\u002Fdiv>\n              <div style=\"font-size: 12px; color: #6b6862; margin-top: 2px;\">{{ e.old }} → {{ e.new }}<\u002Fdiv>\n              <div style=\"font-size: 11px; color: #a6a29b; margin-top: 3px;\">{{ e.time }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN: LEGAL REVIEWER (VIEW ONLY STUB) -->\n  <sc-if value=\"{{ isLegal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 560px; margin: 60px auto; padding: 40px; background: #fff; border: 1px solid #e5e2dc; border-radius: 14px; text-align: center; box-sizing: border-box; box-shadow: 0 4px 16px rgba(32,29,25,0.06);\">\n      <div style=\"font-size: 20px; font-weight: 700; margin-bottom: 6px;\">Legal review<\u002Fdiv>\n      <div style=\"font-size: 14px; color: #55514a; margin-bottom: 20px;\">This view is coming soon for {{ launchNameOrDefault }}.<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ logout }}\" style=\"display: inline-block; padding: 12px 22px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; transition: background 0.15s;\" style-hover=\"background: color-mix(in oklch, var(--accent) 82%, black);\">Log out<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN: PRIYA'S LAUNCHES (HOME) -->\n  <sc-if value=\"{{ isLaunches }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 1000px; margin: 0 auto; padding: 32px; width: 100%; box-sizing: border-box;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;\">\n        <div>\n          <div style=\"font-size: 20px; font-weight: 700;\">Your launches<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8a857c;\">{{ launchesSubtitle }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isLaunchLead }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ openCreateLaunch }}\" style=\"background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; padding: 11px 20px; border-radius: 8px; cursor: pointer; transition: background 0.15s;\" style-hover=\"background: color-mix(in oklch, var(--accent) 82%, black);\">+ New launch<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <sc-for list=\"{{ myLaunches }}\" as=\"ml\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-click=\"{{ ml.onOpenDetail }}\" style=\"border: 1px solid #e5e2dc; border-radius: 12px; background: #fff; padding: 20px; cursor: pointer; box-shadow: 0 1px 3px rgba(32,29,25,0.05); transition: background 0.12s;\" style-hover=\"background: #faf9f6;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;\">\n              <div style=\"font-size: 16px; font-weight: 700;\">{{ ml.name }}<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #a6a29b;\">view details →<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 24px;\">\n              <div><div style=\"font-size: 11px; color: #8a857c; margin-bottom: 4px;\">Progress<\u002Fdiv><div style=\"font-size: 15px; font-weight: 700;\">{{ ml.progressPct }}%<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size: 11px; color: #8a857c; margin-bottom: 4px;\">At risk / blocked<\u002Fdiv><div style=\"font-size: 15px; font-weight: 700; color: {{ ml.riskColor }};\">{{ ml.atRiskCount }} / {{ ml.blockedCount }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size: 11px; color: #8a857c; margin-bottom: 4px;\">Next milestone<\u002Fdiv><div style=\"font-size: 15px; font-weight: 700;\">{{ ml.nextMilestone }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size: 11px; color: #8a857c; margin-bottom: 4px;\">Open compliance flags<\u002Fdiv><div style=\"font-size: 15px; font-weight: 700; color: {{ ml.flagColor }};\">{{ ml.openFlagCount }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN: ALL LAUNCHES (SHARED BY ALL ROLES) -->\n  <sc-if value=\"{{ isAllLaunches }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 1000px; margin: 0 auto; padding: 32px; width: 100%; box-sizing: border-box;\">\n      <div style=\"font-size: 20px; font-weight: 700; margin-bottom: 4px;\">All launches<\u002Fdiv>\n      <div style=\"font-size: 13px; color: #8a857c; margin-bottom: 24px;\">Every product in flight · click one for its overall status summary.<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <sc-for list=\"{{ allLaunchesList }}\" as=\"al\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-click=\"{{ al.onOpenOverview }}\" style=\"border: 1px solid #e5e2dc; border-radius: 12px; background: #fff; padding: 20px; cursor: pointer; box-shadow: 0 1px 3px rgba(32,29,25,0.05); transition: background 0.12s;\" style-hover=\"background: #faf9f6;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;\">\n              <div style=\"font-size: 16px; font-weight: 700;\">{{ al.name }}<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #a6a29b;\">view summary →<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 24px;\">\n              <div><div style=\"font-size: 11px; color: #8a857c; margin-bottom: 4px;\">Progress<\u002Fdiv><div style=\"font-size: 15px; font-weight: 700;\">{{ al.progressPct }}%<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size: 11px; color: #8a857c; margin-bottom: 4px;\">At risk / blocked<\u002Fdiv><div style=\"font-size: 15px; font-weight: 700; color: {{ al.riskColor }};\">{{ al.atRiskCount }} / {{ al.blockedCount }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size: 11px; color: #8a857c; margin-bottom: 4px;\">Next milestone<\u002Fdiv><div style=\"font-size: 15px; font-weight: 700;\">{{ al.nextMilestone }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size: 11px; color: #8a857c; margin-bottom: 4px;\">Open compliance flags<\u002Fdiv><div style=\"font-size: 15px; font-weight: 700; color: {{ al.flagColor }};\">{{ al.openFlagCount }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN 1: CREATE LAUNCH -->\n  <sc-if value=\"{{ isCreate }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 720px; margin: 0 auto; padding: 40px 32px 80px; width: 100%; box-sizing: border-box;\">\n      <div sc-camel-on-click=\"{{ goToLaunches }}\" style=\"font-size: 13px; font-weight: 600; color: #6b6862; cursor: pointer; margin-bottom: 18px;\">← back to your launches<\u002Fdiv>\n\n      <div style=\"font-size: 22px; font-weight: 700; margin-bottom: 4px;\">Create a new launch<\u002Fdiv>\n      <div style=\"font-size: 14px; color: #6b6862; margin-bottom: 28px;\">Start with the basics — you'll set up tasks and team next.<\u002Fdiv>\n\n      <div style=\"display: flex; gap: 16px; margin-bottom: 20px;\">\n        <div style=\"flex: 1;\">\n          <div style=\"font-size: 12px; font-weight: 600; color: #55514a; margin-bottom: 6px;\">Launch name<\u002Fdiv>\n          <input value=\"{{ launchName }}\" sc-camel-on-change=\"{{ onLaunchNameChange }}\" placeholder=\"e.g. Glow serum duo\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px;\">\n        <\u002Fdiv>\n        <div style=\"flex: 1;\">\n          <div style=\"font-size: 12px; font-weight: 600; color: #55514a; margin-bottom: 6px;\">Category<\u002Fdiv>\n          <input value=\"Beauty &amp; personal care\" disabled=\"{{ true }}\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; background: #f3f1ec; color: #6b6862;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;\">\n        <div style=\"font-size: 12px; font-weight: 600; color: #55514a;\">Description<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ generateAIDescription }}\" style=\"font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: oklch(94% 0.03 262); color: oklch(45% 0.14 262); cursor: pointer; display: flex; align-items: center; gap: 5px;\" style-hover=\"background: oklch(90% 0.05 262);\">\n          <span>✨<\u002Fspan><span>{{ descAiButtonLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ descAiError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size: 12px; color: oklch(50% 0.16 25); margin-bottom: 6px;\">{{ descAiError }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <textarea value=\"{{ draftDescription }}\" sc-camel-on-change=\"{{ onDraftDescriptionChange }}\" placeholder=\"What is this launch and why does it matter?\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; min-height: 80px; font-family: inherit; resize: vertical; margin-bottom: 24px;\"><\u002Ftextarea>\n\n      <div style=\"display: flex; gap: 14px; margin-bottom: 28px;\">\n        <div sc-camel-on-click=\"{{ goToCreateTasks }}\" style=\"flex: 1; border: 1px solid #e5e2dc; border-radius: 12px; padding: 18px; background: #fff; cursor: pointer; box-shadow: 0 1px 3px rgba(32,29,25,0.05);\" style-hover=\"background: #faf9f6;\">\n          <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 4px;\">Launch readiness checklist →<\u002Fdiv>\n          <div style=\"font-size: 12.5px; color: #8a857c;\">{{ draftTaskCountLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ goToCreateTeam }}\" style=\"flex: 1; border: 1px solid #e5e2dc; border-radius: 12px; padding: 18px; background: #fff; cursor: pointer; box-shadow: 0 1px 3px rgba(32,29,25,0.05);\" style-hover=\"background: #faf9f6;\">\n          <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 4px;\">Team, leadership &amp; stakeholders →<\u002Fdiv>\n          <div style=\"font-size: 12.5px; color: #8a857c;\">{{ draftTeamCountLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; justify-content: flex-end;\">\n        <div sc-camel-on-click=\"{{ createLaunch }}\" style=\"background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; padding: 12px 22px; border-radius: 8px; cursor: pointer; transition: background 0.15s;\" style-hover=\"background: color-mix(in oklch, var(--accent) 82%, black);\">Create launch<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN 1B: CREATE LAUNCH — DEPENDENCY TASKS -->\n  <sc-if value=\"{{ isCreateTasks }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 880px; margin: 0 auto; padding: 40px 32px 80px; width: 100%; box-sizing: border-box;\">\n      <div sc-camel-on-click=\"{{ backToCreateDetails }}\" style=\"font-size: 13px; font-weight: 600; color: #6b6862; cursor: pointer; margin-bottom: 18px;\">← back to launch details<\u002Fdiv>\n\n      <div style=\"font-size: 22px; font-weight: 700; margin-bottom: 4px;\">Launch readiness checklist<\u002Fdiv>\n      <div style=\"font-size: 14px; color: #6b6862; margin-bottom: 28px;\">Set up the launch readiness checklist and assign owners for \"{{ launchNameOrDefault }}\".<\u002Fdiv>\n\n      <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 20px;\">\n        <div style=\"font-size: 12px; font-weight: 600; color: #55514a;\">Start from a saved template<\u002Fdiv>\n        <sc-raw-select value=\"{{ selectedTemplateId }}\" sc-camel-on-change=\"{{ onSelectTemplateChange }}\" style=\"font-size: 13px; padding: 6px 10px; border: 1px solid #d8d4cc; border-radius: 8px; background: #fff;\">\n          <option value=\"\">Default checklist<\u002Foption>\n          <sc-for list=\"{{ launchTemplates }}\" as=\"tpl\" hint-placeholder-count=\"0\">\n            <option value=\"{{ tpl.id }}\">{{ tpl.name }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n\n      <div style=\"border: 1px solid #d8d4cc; border-radius: 12px; padding: 16px; margin-bottom: 20px; background: #faf9f6;\">\n        <div style=\"font-size: 12.5px; font-weight: 700; margin-bottom: 4px;\">Upload your own launch checklist<\u002Fdiv>\n        <div style=\"font-size: 11.5px; color: #8a857c; margin-bottom: 10px;\">Any document (text/Markdown works best). AI reads it and builds parent tasks with dependency sub-items routed to each assignee.<\u002Fdiv>\n        <input type=\"file\" sc-camel-on-change=\"{{ onChecklistFileChange }}\" style=\"font-size: 12.5px;\">\n        <sc-if value=\"{{ checklistLoading }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 12.5px; color: #8a857c; margin-top: 8px;\">✨ Reading \"{{ checklistFileName }}\"…<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ checklistError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 12.5px; color: oklch(50% 0.16 25); margin-top: 8px;\">{{ checklistError }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasParsedChecklist }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top: 12px; border: 1px solid #e5e2dc; border-radius: 10px; background: #fff; overflow: hidden;\">\n            <sc-for list=\"{{ parsedChecklist }}\" as=\"pt\" hint-placeholder-count=\"2\">\n              <div style=\"padding: 10px 12px; border-bottom: 1px solid #eeece7;\">\n                <div style=\"display: flex; align-items: center; gap: 8px;\">\n                  <input value=\"{{ pt.name }}\" sc-camel-on-change=\"{{ pt.onNameChange }}\" style=\"flex: 1; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 12.5px; font-weight: 600;\">\n                  <sc-raw-select value=\"{{ pt.owner }}\" sc-camel-on-change=\"{{ pt.onOwnerChange }}\" style=\"font-size: 12px; padding: 6px 8px; border: 1px solid #d8d4cc; border-radius: 8px; background: #fff;\">\n                    <sc-for list=\"{{ rosterOwners }}\" as=\"pto\" hint-placeholder-count=\"4\">\n                      <option value=\"{{ pto }}\">{{ pto }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <input type=\"number\" min=\"1\" value=\"{{ pt.durationDays }}\" sc-camel-on-change=\"{{ pt.onDurationChange }}\" style=\"width: 48px; box-sizing: border-box; padding: 6px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 12px; text-align: center;\" title=\"Days required\">\n                  <div sc-camel-on-click=\"{{ pt.onDelete }}\" style=\"cursor: pointer; color: #a6a29b; font-size: 14px;\">✕<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ pt.subtasks Fdiv>\n                <div style=\"font-size: 11.5px; color: #8a857c;\">suggested owner: {{ sug.owner }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ sug.onAdd }}\" style=\"font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 8px; border: 1px solid oklch(80% 0.06 262); color: oklch(45% 0.14 262); cursor: pointer; white-space: nowrap;\">+ add<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ sug.onDismiss }}\" style=\"cursor: pointer; color: #a6a29b; font-size: 14px; line-height: 1;\">✕<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"border: 1px solid #e5e2dc; border-radius: 12px; background: #fff; overflow: hidden; box-shadow: 0 1px 3px rgba(32,29,25,0.05);\">\n        <sc-for list=\"{{ tasks }}\" as=\"t\" hint-placeholder-count=\"8\">\n          <div style=\"display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #eeece7;\">\n            <div style=\"width: 24px; height: 24px; border-radius: 999px; background: #f3f1ec; color: #6b6862; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">{{ t.step }}<\u002Fdiv>\n            <div style=\"flex: 1; font-size: 14px; font-weight: 600;\">{{ t.name }}<\u002Fdiv>\n            <sc-if value=\"{{ t.custom }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 10px; font-weight: 700; color: oklch(45% 0.14 262); background: oklch(94% 0.03 262); padding: 3px 8px; border-radius: 999px;\">custom<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-raw-select value=\"{{ t.owner }}\" sc-camel-on-change=\"{{ t.onOwnerChange }}\" style=\"font-size: 13px; padding: 7px 10px; border: 1px solid #d8d4cc; border-radius: 8px; background: #fff; width: 150px;\">\n              <sc-for list=\"{{ rosterOwners }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <option value=\"{{ o  pointer; transition: background 0.15s;\" style-hover=\"background: color-mix(in oklch, var(--accent) 82%, black);\">Done<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN 1C: CREATE LAUNCH — MANAGE TEAM -->\n  <sc-if value=\"{{ isCreateTeam }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 720px; margin: 0 auto; padding: 40px 32px 80px; width: 100%; box-sizing: border-box;\">\n      <div sc-camel-on-click=\"{{ backToCreateDetails }}\" style=\"font-size: 13px; font-weight: 600; color: #6b6862; cursor: pointer; margin-bottom: 18px;\">← back to launch details<\u002Fdiv>\n\n      <div style=\"font-size: 22px; font-weight: 700; margin-bottom: 4px;\">Team, leadership &amp; stakeholders<\u002Fdiv>\n      <div style=\"font-size: 14px; color: #6b6862; margin-bottom: 28px;\">Add everyone involved in \"{{ launchNameOrDefault }}\" — team members, leadership, other stakeholders, or external contacts — and set what they can view.<\u002Fdiv>\n\n      <div style=\"display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;\">\n        <input value=\"{{ newTeamName }}\" sc-camel-on-change=\"{{ onNewTeamNameChange }}\" placeholder=\"Full name\" style=\"flex: 1.2; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px;\">\n        <input value=\"{{ newTeamEmail }}\" sc-camel-on-change=\"{{ onNewTeamEmailChange }}\" placeholder=\"email@brand.com\" style=\"flex: 1.4; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px;\">\n        <input value=\"{{ newTeamTitle }}\" sc-camel-on-change=\"{{ onNewTeamTitleChange }}\" placeholder=\"Title (optional)\" style=\"flex: 1.2; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px;\">\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center;\">\n        <sc-raw-select value=\"{{ newTeamGroup }}\" sc-camel-on-change=\"{{ onNewTeamGroupChange }}\" style=\"flex: 1; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; background: #fff;\">\n          <sc-for list=\"{{ groupOptions }}\" as=\"ntg\" hint-placeholder-count=\"4\">\n            <option value=\"{{ ntg.value }}\">{{ ntg.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <sc-raw-select value=\"{{ newTeamRole }}\" sc-camel-on-change=\"{{ onNewTeamRoleChange }}\" style=\"flex: 1; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; background: #fff;\">\n          <sc-for list=\"{{ memberFunctionOptions }}\" as=\"ntr\" hint-placeholder-count=\"5\">\n            <option value=\"{{ ntr.value }}\">{{ ntr.label }}<\u002Foption>\n          <\u002Fsc-for>\n          <option value=\"external\">External<\u002Foption>\n        <\u002Fsc-raw-select>\n        <div sc-camel-on-click=\"{{ addTeamMember }}\" style=\"padding: 10px 18px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;\">Add<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 18px; margin-bottom: 20px; align-items: center;\">\n        <label style=\"display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #55514a; cursor: pointer;\">\n          <input type=\"checkbox\" checked=\"{{ newTeamPermSummary }}\" sc-camel-on-change=\"{{ onNewTeamPermSummaryChange }}\">Can view launch summary\n        <\u002Flabel>\n        <label style=\"display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #55514a; cursor: pointer;\">\n          <input type=\"checkbox\" checked=\"{{ newTeamPermRetro }}\" sc-camel-on-change=\"{{ onNewTeamPermRetroChange }}\">Can view retrospective\n        <\u002Flabel>\n      <\u002Fdiv>\n\n      <div style=\"border: 1px solid #d8d4cc; border-radius: 12px; padding: 16px; margin-bottom: 20px; background: #faf9f6;\">\n        <div style=\"font-size: 12.5px; font-weight: 700; margin-bottom: 4px;\">Upload a team roster<\u002Fdiv>\n        <div style=\"font-size: 11.5px; color: #8a857c; margin-bottom: 10px;\">Any .txt or .csv with name, email, and role per person — either \"Name: / Email: / Role:\" blocks or one comma-separated row each. Parsed into the list below.<\u002Fdiv>\n        <input type=\"file\" sc-camel-on-change=\"{{ onTeamFileChange }}\" style=\"font-size: 12.5px;\">\n        <sc-if value=\"{{ teamUploadLoading }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 12.5px; color: #8a857c; margin-top: 8px;\">Reading \"{{ teamFileName }}\"…<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ teamUploadError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 12.5px; color: oklch(50% 0.16 25); margin-top: 8px;\">{{ teamUploadError }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasParsedTeam }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top: 12px; border: 1px solid #e5e2dc; border-radius: 10px; background: #fff; overflow: hidden;\">\n            <sc-for list=\"{{ parsedTeam }}\" as=\"pm\" hint-placeholder-count=\"2\">\n              <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #eeece7;\">\n                <div style=\"flex: 1;\">\n                  <div style=\"font-size: 13px; font-weight: 600;\">{{ pm.name }}<\u002Fdiv>\n                  <div style=\"font-size: 11.5px; color: #8a857c;\">{{ pm.email }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-raw-select value=\"{{ pm.role }}\" sc-camel-on-change=\"{{ pm.onRoleChange }}\" style=\"font-size: 12px; padding: 6px 8px; border: 1px solid #d8d4cc; border-radius: 8px; background: #fff;\">\n                  <sc-for list=\"{{ memberFunctionOptions }}\" as=\"pmr\" hint-placeholde px; border-radius: 8px; background: oklch(94% 0.04 150); font-size: 13px; color: oklch(35% 0.1 150); font-weight: 600;\">{{ bookingConfirmationText }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ canEditUpstream }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border: 1px solid #e5e2dc; border-radius: 12px; background: #fff; padding: 16px; box-shadow: 0 1px 3px rgba(32,29,25,0.05);\">\n            <div style=\"font-size: 13px; font-weight: 700; margin-bottom: 10px;\">Adjust vendor booking<\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px;\">\n              <sc-raw-select value=\"{{ bookingVendorId }}\" sc-camel-on-change=\"{{ onBookingVendorChange }}\" style=\"flex: 1.4; min-width: 180px; box-sizing: border-box; padding: 9px 10px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 13px; background: #fff;\">\n                <option value=\"\">Which vendor is delayed?…<\u002Foption>\n                <sc-for list=\"{{ bookingVendorOptions }}\" as=\"bv\" hint-placeholder-count=\"2\">\n                  <option value=\"{{ bv.id }}\">{{ bv.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <sc-raw-select value=\"{{ bookingReasonCode }}\" sc-camel-on-change=\"{{ onBookingReasonChange }}\" style=\"flex: 1; min-width: 160px; box-sizing: border-box; padding: 9px 10px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 13px; background: #fff;\">\n                <option value=\"\">Reason code…<\u002Foption>\n                <sc-for list=\"{{ bookingReasonOptions }}\" as=\"br\" hint-placeholder-count=\"6\">\n                  <option value=\"{{ br }}\">{{ br }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <div style=\"display: flex; align-items: center; gap: 6px;\">\n                <input type=\"number\" min=\"1\" value=\"{{ bookingExtensionDays }}\" sc-camel-on-change=\"{{ onBookingDaysChange }}\" style=\"width: 60px; box-sizing: border-box; padding: 9px 8px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 13px;\">\n                <span style=\"font-size: 12.5px; color: #6b6862;\">days extension<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ bookingReasonIsOther }}\" hint-placeholder-val=\"{{ false }}\">\n              <input value=\"{{ bookingOtherReason }}\" sc-camel-on-change=\"{{ onBookingOtherReasonChange }}\" placeholder=\"Describe the reason\" style=\"width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 13px; margin-bottom: 12px;\">\n            <\u002Fsc-if>\n            <div sc-camel-on-click=\"{{ adjustBooking }}\" style=\"display: inline-block; padding: 11px 20px; border-radius: 8px; font-size: 13.5px; font-weight: 700; cursor: {{ bookingSubmitCursor }}; background: var(--accent); color: #fff; opacity: {{ bookingSubmitOpacity }}; transition: background 0.15s;\" style-hover=\"background: color-mix(in oklch, var(--accent) 82%, black);\">Adjust booking<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ upstreamReadOnlyNotice }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 12.5px; color: #8a857c;\">🔒 View only — adjusting the booking is limited to upstream ops or the launch lead.<\u002Fdiv>\n        <\u002Fsc-if>\n\n      <div style=\"font-size: 13px; font-weight: 700; margin: 20px 0 10px;\">Accountability trail<\u002Fdiv>\n      <div style=\"border: 1px solid #e5e2dc; border-radius: 12px; background: #fff; padding: 16px;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;\">\n          <div style=\"font-size: 11.5px; color: #8a857c;\">Full launch activity, including compliance sign-offs — so you know when it's safe to start your own work.<\u002Fdiv>\n          <a href=\"#\" sc-camel-on-clic -weight: 700; margin-bottom: 6px;\">No launch assigned yet<\u002Fdiv>\n      <div style=\"font-size: 14px; color: #55514a; margin-bottom: 20px;\">You'll see a read-only dashboard once an admin or launch lead assigns you to a product launch.<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ logout }}\" style=\"display: inline-block; padding: 12px 22px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; transition: background 0.15s;\" style-hover=\"background: color-mix(in oklch, var(--accent) 82%, black);\">Log out<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- SCREEN: CUSTOM ROLE DASHBOARD -->\n  <sc-if value=\"{{ isCustomDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 1000px; margin: 0 auto; padding: 32px; width: 100%; box-sizing: border-box;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;\">\n        <div>\n          <div style=\"font-size: 20px; font-weight: 700;\">{{ launchNameOrDefault }}<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8a857c;\">{{ customRoleLabel }} · view only<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <div sc-camel-on-click=\"{{ goToAllLaunches }}\" style=\"font-size: 13px; font-weight: 600; padding: 9px 14px; border: 1px solid #d8d4cc; border-radius: 8px; cursor: pointer; transition: background 0.15s;\" style-hover=\"background: #f3f1ec;\">Switch launch<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ logout }}\" style=\"font-size: 13px; font-weight: 600; color: #6b6862; cursor: pointer;\">log out<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 16px; margin-bottom: 24px;\">\n        <div style=\"flex: 1; border: 1px solid #e5e2dc; border-radius: 12px; padding: 18px; background: #fff; box-shadow: 0 1px 3px rgba(32,29,25,0.05);\">\n          <div style=\" center; justify-content: center; z-index: 50;\">\n      <div style=\"width: 440px; background: #fff; border-radius: 14px; border: 1px solid #e5e2dc; padding: 24px; box-sizing: border-box; box-shadow: 0 12px 32px rgba(32,29,25,0.14);\">\n        <div style=\"font-size: 17px; font-weight: 700; margin-bottom: 4px;\">Flag a concern<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #6b6862; margin-bottom: 20px;\">{{ flagTaskName }} — routes back to the task owner, cc'd to Priya.<\u002Fdiv>\n\n        <div style=\"font-size: 12px; font-weight: 600; color: #55514a; margin-bottom: 6px;\">Reason category<\u002Fdiv>\n        <sc-raw-select value=\"{{ flagReason }}\" sc-camel-on-change=\"{{ onFlagReasonChange }}\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; margin-bottom: 16px; background: #fff;\">\n          <option value=\"\">Select a reason…<\u002Foption>\n          <sc-for list=\"{{ flagReasonOptions }}\" as=\"fr\" hint-placeholder-count=\"4\">\n            <option value=\"{{ fr }}\">{{ fr }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;\">\n          <div style=\"font-size: 12px; font-weight: 600; color: #55514a;\">Detail (optional)<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ draftFlagDetailWithAI }}\" style=\"font-size: 11.5px; font-weight: 700; color: {{ aiDraftColor }}; cursor: {{ aiDraftCursor }}; display: flex; align-items: center; gap: 4px;\">\n            <span>✨<\u002Fspan><span>{{ aiDraftButtonLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ aiDraftError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 12px; color: oklch(50% 0.16 25); margin-bottom: 8px;\">{{ aiDraftError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <textarea value=\"{{ flagDetail }}\" sc-camel-on-change=\"{{ onFlagDetailChange }}\" placeholder=\"Add any specifics for the owner\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; margin-bottom: 20px; min-height: 70px; font-family: inherit; resize: vertical;\"><\u002Ftextarea>\n\n        <div style=\"display: flex; justify-content: flex-end; gap: 10px;\">\n          <div sc-camel-on-click=\"{{ closeFlagModal }}\" style=\"padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #d8d4cc; transition: background 0.15s;\" style-hover=\"background: #f3f1ec;\">Cancel<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ submitFlag }}\" style=\"padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: {{ flagSubmitCursor }}; background: var(--accent); color: #fff; opacity: {{ flagSubmitOpacity }};\">Submit flag<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- MODAL: ADD TASK (shared — draft launch or existing launch) -->\n  <sc-if value=\"{{ showAddTask }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; background: rgba(30,28,24,0.35); display: flex; align-items: center; justify-content: center; z-index: 50;\">\n      <div style=\"width: 460px; background: #fff; border-radius: 14px; border: 1px solid #e5e2dc; padding: 24px; box-sizing: border-box; box-shadow: 0 12px 32px rgba(32,29,25,0.14);\">\n        <div style=\"font-size: 17px; font-weight: 700; margin-bottom: 4px;\">Add a task<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #6b6862; margin-bottom: 20px;\">Custom tasks don't count against your checklist coverage score.<\u002Fdiv>\n\n        <div style=\"font-size: 12px; font-weight: 600; color: #55514a; margin-bottom: 6px;\">Task name<\u002Fdiv>\n        <input value=\"{{ newTaskName }}\" sc-camel-on-change=\"{{ onNewTaskNameChange }}\" placeholder=\"e.g. Influencer seeding\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; margin-bottom: 16px;\">\n\n        <div style=\"font-size: 12px; font-weight: 600; color: #55514a; margin-bottom: 6px;\">Insert after<\u002Fdiv>\n        <sc-raw-select value=\"{{ newTaskInsertAfter }}\" sc-camel-on-change=\"{{ onInsertAfterChange }}\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; margin-bottom: 16px; background: #fff;\">\n          <sc-for list=\"{{ newTaskInsertOptions }}\" as=\"t2\" hint-placeholder-count=\"8\">\n            <option value=\"{{ t2.id }}\">{{ t2.name }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n\n        <div style=\"font-size: 12px; font-weight: 600; color: #55514a; margin-bottom: 6px;\">Owner<\u002Fdiv>\n        <sc-raw-select value=\"{{ newTaskOwner }}\" sc-camel-on-change=\"{{ onNewTaskOwnerChange }}\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; margin-bottom: 16px; background: #fff;\">\n          <sc-for list=\"{{ owners }}\" as=\"o2\" hint-placeholder-count=\"4\">\n            <option value=\"{{ o2 }}\">{{ o2 }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n\n        <div style=\"font-size: 12px; font-weight: 600; color: #55514a; margin-bottom: 6px;\">Time required (days)<\u002Fdiv>\n        <input type=\"number\" min=\"1\" value=\"{{ newTaskDuration }}\" sc-camel-on-change=\"{{ onNewTaskDurationChange }}\" style=\"width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d8d4cc; border-radius: 8px; font-size: 14px; margin-bottom: 18px;\">\n\n        <div sc-camel-on-click=\"{{ toggleNewTaskBlocks }}\" style=\"display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid #eeece7; border-radius: 8px; cursor: pointer; margin-bottom: 22px;\">\n          <div>\n            <div style=\"font-size: 13px; font-weight: 600;\">Blocks downstream tasks<\u002Fdiv>\n            <div style=\"font-size: 11px; color: #8a857c;\">Later tasks can't start until this is done<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width: 40px; height: 22px; border-radius: 999px; padding: 2px; box-sizing: border-box; background: {{ newTaskBlocksTrackColor }};\">\n            <div style=\"width: 18px; height: 18px; border-radius: 999px; background: #fff; transform: {{ newTaskBlocksThumbTransform }}; transition: transform 0.15s;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; justify-content: flex-end; gap: 10px;\">\n          <div sc-camel-on-click=\"{{ closeAddTask }}\" style=\"padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #d8d4cc; transition: background 0.15s;\" style-hover=\"background: #f3f1ec;\">Cancel<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ confirmAddTask }}\" style=\"padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; transition: background 0.15s;\" style-hover=\"background: color-mix(in oklch, var(--accent) 82%, black);\">Add task<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}, &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;oklch(55% 0.16 262)&quot;, &quot;options&quot;: [&quot;oklch(55% 0.16 262)&quot;, &quot;oklch(55% 0.16 195)&quot;, &quot;oklch(55% 0.16 150)&quot;, &quot;oklch(55% 0.16 30)&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Branding&quot;}, &quot;defaultComplianceAssignee&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Rohan&quot;, &quot;options&quot;: [&quot;Priya&quot;, &quot;Rohan&quot;, &quot;Ananya&quot;, &quot;Karan&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behavior&quot;}, &quot;requirePacketPreview&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;}}\">\nconst OWNERS = ['Priya', 'Rohan', 'Ananya', 'Karan'];\nconst STAGE_DEFS = [\n  { name: 'Formulation lock', owner: 'Priya', status: 'on track', blocks: true, durationDays: 5 },\n  { name: 'Stability/compatibility testing', owner: 'Priya', status: 'at risk', blocks: true, durationDays: 10 },\n  { name: 'Regulatory compliance review', owner: 'Rohan', status: 'at risk', blocks: true, durationDays: 7 },\n  { name: 'Packaging tooling', owner: 'Ananya', status: 'blocked', blocks: true, durationDays: 8 },\n  { name: 'Manufacturing', owner: 'Ananya', status: 'on track', blocks: true, durationDays: 6 },\n  { name: 'Quality control', owner: 'Ananya', status: 'on track', blocks: true, durationDays: 3 },\n  { name: 'Marketing asset production', owner: 'Karan', status: 'on track', blocks: false, durationDays: 5 },\n  { name: 'Listing live', owner: 'Priya', status: 'on track', blocks: false, durationDays: 2 },\n];\nconst STATUSES = ['not_started', 'on track', 'at risk', 'blocked', 'completed'];\nfunction daysToCompleteLabel(t, launch) {\n  if (t.status !== 'completed' || !t.completedAt) return '';\n  const start = t.startedAt || (launch && launch.createdAt) || t.completedAt;\n  const days = Math.max(0, Math.round((t.completedAt - start) / 86400000));\n  return days === 1 ? '1 day' : days + ' days';\n}\nfunction daysLaggingLabel(t, launch) {\n  if (t.status !== 'at risk' && t.status !== 'blocked') return '';\n  const start = t.startedAt || (launch && launch.createdAt) || Date.now();\n  const elapsedDays = Math.floor((Date.now() - start) / 86400000);\n  const lag = Math.max(0, elapsedDays - (t.durationDays || 0));\n  if (lag <= 0) return '';\n  return lag === 1 ? '1 day behind' : lag + ' days behind';\n}\nfunction computeNextMilestone(tasks) {\n  const sorted = tasks.slice().sort(function (a, b) { return a.step - b.step; });\n  let cumulative = 0, best = null;\n  sorted.forEach(function (t) {\n    cumulative += (t.durationDays || 1);\n    if (!best && t.status !== 'completed') best = { task: t, day: cumulative };\n  });\n  return best || { task: tasks[tasks.length - 1], day: cumulative };\n}\nfunction formatDueDate(createdAt, dayOffset) {\n  if (!createdAt) return '';\n  const d = new Date(createdAt);\n  d.setDate(d.getDate() + dayOffset);\n  return 'due ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });\n}\nfunction computeLaunchEstimate(launch) {\n  const tasks = launch.tasks;\n  const totalPlannedDays = tasks.reduce(function (sum, t) { return sum + (t.durationDays || 1); }, 0);\n  const plannedDate = new Date(launch.createdAt + totalPlannedDays * 86400000);\n  const lagDays = tasks.reduce(function (sum, t) {\n    if ((t.status !== 'at risk' && t.status !== 'blocked') || !t.blocks) return sum;\n    const start = t.startedAt || launch.createdAt;\n    const elapsedDays = Math.floor((Date.now() - start) / 86400000);\n    const lag = Math.max(0, elapsedDays - (t.durationDays || 0));\n    return sum + lag;\n  }, 0);\n  const estimatedDate = lagDays > 0 ? new Date(plannedDate.getTime() + lagDays * 86400000) : plannedDate;\n  const fmt = function (d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };\n  return { plannedLabel: fmt(plannedDate), estimatedLabel: fmt(estimatedDate), isDelayed: lagDays > 0, lagDays: lagDays };\n}\nconst ROOT_CAUSES = ['upstream dependency', 'vendor delay', 'resourcing', 'external vendor', 'scope change', 'other'];\nconst ROLE_LABELS = { launch_lead: 'NPD manager · launch lead', compliance: 'Compliance', legal: 'Legal reviewer', upstream_ops: 'Upstream ops', marketing: 'Marketing (view only)', admin: 'Admin', external: 'External (view only)' };\nconst ROLE_SCREEN = { launch_lead: 'launches', compliance: 'rohan', legal: 'legal', upstream_ops: 'upstream', marketing: 'marketing', admin: 'admin', external: 'external-view' };\nconst LOGIN_LANDING_SCREEN = Object.assign({}, ROLE_SCREEN, { compliance: 'launches', upstream_ops: 'launches', marketing: 'launches', legal: 'launches' });\nconst DASHBOARD_SCREEN_FOR_ROLE = Object.assign({}, ROLE_SCREEN, { launch_lead: 'dashboard', admin: 'dashboard' });\nconst TIER_LABELS = { owner: 'Launch Owner', member: 'Team Member', external: 'External' };\nconst GROUP_OPTIONS = [\n  { value: 'leadership', label: 'Leadership' },\n  { value: 'stakeholder', label: 'Stakeholder' },\n  { value: 'team', label: 'Team member' },\n  { value: 'external', label: 'External' },\n];\nconst GROUP_LABELS = { leadership: 'Leadership', stakeholder: 'Stakeholder', team: 'Team member', external: 'External' };\nconst ROLE_OPTIONS = [\n  { value: 'launch_lead', label: 'NPD manager · launch lead' },\n  { value: 'compliance', label: 'Compliance' },\n  { value: 'legal', label: 'Legal reviewer' },\n  { value: 'upstream_ops', label: 'Upstream ops' },\n  { value: 'marketing', label: 'Marketing (view only)' },\n  { value: 'admin', label: 'Admin' },\n];\nconst OWNER_ROLE = { Priya: 'launch_lead', Rohan: 'compliance', Ananya: 'upstream_ops', Karan: 'marketing' };\nconst ROLE_OWNER = { launch_lead: 'Priya', compliance: 'Rohan', upstream_ops: 'Ananya', marketing: 'Karan' };\nconst FLAG_REASONS = ['claim not substantiated', 'ingredient restricted', 'packaging claim mismatch', 'other'];\nfunction makeLaunch(id, name, stageDefs, complianceFlags, trailEntries, createdAt, team, closed, description) {\n  return {\n    id: id, name: name,\n    tasks: stageDefs.map(function (s, i) { return { id: id * 100 + i + 1, step: i + 1, name: s.name, owner: s.owner, status: s.status, custom: false, blocks: s.
